<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Cyber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .banner-container {
            width: 100%;
            height: 210px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .banner-container img, 
        .banner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95));
            pointer-events: none;
            z-index: 2;
        }

        .banner-upload-btn {
            position: relative;
            z-index: 3;
            background: rgba(15, 23, 42, 0.7);
            border: 2px dashed #38bdf8;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .banner-upload-btn.hidden {
            display: none;
        }

        .banner-upload-btn svg {
            width: 32px;
            height: 32px;
            fill: #38bdf8;
        }

        .content-body {
            padding: 16px;
            margin-top: -35px;
            position: relative;
            z-index: 4;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .profile-avatar-container {
            position: relative;
            width: 65px;
            height: 65px;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #1e293b;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar svg {
            width: 28px;
            height: 28px;
            fill: #64748b;
        }

        .avatar-upload-overlay {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #0284c7;
            border: 2px solid #0f172a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .avatar-upload-overlay svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .profile-info {
            flex-grow: 1;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .profile-info h2 {
            font-size: 1.05rem;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .edit-icon {
            width: 14px;
            height: 14px;
            fill: #94a3b8;
        }

        .profile-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: rgba(2, 132, 199, 0.25);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.4);
            font-weight: 600;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-card:active {
            transform: scale(0.96);
            background: rgba(30, 41, 59, 0.95);
            border-color: #38bdf8;
        }

        .action-icon-wrapper {
            width: 36px;
            height: 36px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .action-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: #38bdf8;
        }

        .action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .action-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .footer-status {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: auto;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .modal-header {
            padding: 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .search-box-container {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        .custom-input {
            flex-grow: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
        }

        .custom-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .custom-btn:active {
            background: #0369a1;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .info-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .info-value {
            color: #f8fafc;
            font-weight: 600;
            text-align: right;
        }

        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-top: 4px;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="banner-container" id="banner-container" onclick="document.getElementById('banner-file-input').click()">
            <div class="banner-overlay"></div>
            <div class="banner-upload-btn" id="banner-upload-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <input type="file" id="banner-file-input" class="hidden-input" accept="image/*,video/*" onchange="carregarBanner(event)">
        </div>

        <div class="content-body">
            <div class="profile-card">
                <div class="profile-avatar-container">
                    <div class="profile-avatar" id="profile-avatar">
                        <svg id="avatar-placeholder-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="avatar-upload-overlay" onclick="document.getElementById('avatar-file-input').click()">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                    <input type="file" id="avatar-file-input" class="hidden-input" accept="image/*" onchange="carregarAvatar(event)">
                </div>

                <div class="profile-info">
                    <div class="name-wrapper" onclick="editarNome()">
                        <h2 id="user-name">DEFINIR NOME</h2>
                        <svg class="edit-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>
                    <span id="user-role" class="profile-badge">ROLE: USER</span>
                </div>
            </div>

            <div class="grid-2x2">
                <div class="action-card" onclick="abrirBuscaIP()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Busca de IP</div>
                        <div class="action-desc">Consultar IP de terceiros</div>
                    </div>
                </div>

                <div class="action-card" onclick="abrirBuscaLink()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Busca via Link</div>
                        <div class="action-desc">Painel & Myprivate Maps</div>
                    </div>
                </div>

                <div class="action-card" onclick="funcaoBotao3()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 03</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <div class="action-card" onclick="funcaoBotao4()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M12 2.5s5 2 5 9.5c0 3.5-1.5 6-3 7l-2 3-2-3c-1.5-1-3-3.5-3-7 0-7.5 5-9.5 5-9.5zm0 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 04</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>
            </div>

            <div class="footer-status">
                Status: Sistema Operacional Online
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="app-modal" onclick="fecharModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modal-title">Painel de Dados</span>
                <button class="modal-close" onclick="fecharModalDireto()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedName = localStorage.getItem('userName');
            if (savedName) document.getElementById('user-name').textContent = savedName;

            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) aplicarAvatar(savedAvatar);

            const savedBanner = localStorage.getItem('userBanner');
            const savedBannerType = localStorage.getItem('userBannerType');
            if (savedBanner) aplicarBanner(savedBanner, savedBannerType === 'video');
        };

        function carregarBanner(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                const isVideo = file.type.startsWith('video');
                localStorage.setItem('userBanner', fileURL);
                localStorage.setItem('userBannerType', isVideo ? 'video' : 'image');
                aplicarBanner(fileURL, isVideo);
            };
            reader.readAsDataURL(file);
        }

        function aplicarBanner(url, isVideo) {
            const bannerContainer = document.getElementById('banner-container');
            const uploadBtn = document.getElementById('banner-upload-btn');
            const oldMedia = bannerContainer.querySelector('img, video');
            if (oldMedia) oldMedia.remove();

            if (isVideo) {
                const video = document.createElement('video');
                video.src = url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                bannerContainer.insertBefore(video, bannerContainer.firstChild);
            } else {
                const img = document.createElement('img');
                img.src = url;
                bannerContainer.insertBefore(img, bannerContainer.firstChild);
            }
            uploadBtn.classList.add('hidden');
        }

        function carregarAvatar(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                localStorage.setItem('userAvatar', fileURL);
                aplicarAvatar(fileURL);
            };
            reader.readAsDataURL(file);
        }

        function aplicarAvatar(url) {
            document.getElementById('profile-avatar').innerHTML = `<img src="${url}" alt="Avatar">`;
        }

        function editarNome() {
            const atual = document.getElementById('user-name').textContent;
            const novoNome = prompt("Digite o novo nome do perfil:", atual === "DEFINIR NOME" ? "" : atual);
            if (novoNome && novoNome.trim() !== "") {
                const nomeFinal = novoNome.trim();
                document.getElementById('user-name').textContent = nomeFinal;
                localStorage.setItem('userName', nomeFinal);
            }
        }

        function fecharModal(event) {
            if (event.target.id === 'app-modal') document.getElementById('app-modal').classList.remove('active');
        }

        function fecharModalDireto() {
            document.getElementById('app-modal').classList.remove('active');
        }

        function abrirBuscaIP() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Consulta de IP (ipinfo.io)";
            modal.classList.add('active');

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Digite o endereço IP da outra pessoa para consultar:</div>
                <div class="search-box-container">
                    <input type="text" id="ip-input-target" class="custom-input" placeholder="Ex: 8.8.8.8">
                    <button class="custom-btn" onclick="consultarIPAlvo()">Buscar</button>
                </div>
                <div id="ip-result-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
                    <div style="text-align: center; color: #64748b; padding: 20px;">Insira um IP acima para ver os dados.</div>
                </div>
            `;
        }

        async function consultarIPAlvo() {
            const ipInput = document.getElementById('ip-input-target').value.trim();
            const resultContainer = document.getElementById('ip-result-container');
            if (!ipInput) { alert("Por favor, digite um endereço IP válido."); return; }

            resultContainer.innerHTML = `<div style="text-align: center; padding: 20px; color: #94a3b8;">Consultando IP ${ipInput}...</div>`;

            try {
                const response = await fetch(`https://ipinfo.io/${ipInput}/json`);
                const data = await response.json();
                if (data.error) {
                    resultContainer.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 15px;">IP inválido ou não encontrado.</div>`;
                    return;
                }
                const coords = data.loc ? data.loc.split(',') : [0, 0];
                resultContainer.innerHTML = `
                    <div class="info-row"><span class="info-label">Endereço IP:</span><span class="info-value">${data.ip || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Hostname:</span><span class="info-value">${data.hostname || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Cidade:</span><span class="info-value">${data.city || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Região / Estado:</span><span class="info-value">${data.region || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">País:</span><span class="info-value">${data.country || 'N/A'}</span></div>
                    <div class="info-row"><span class="info-label">Provedor (ISP):</span><span class="info-value">${data.org || 'N/A'}</span></div>
                    <div style="font-weight: 600; color: #38bdf8; margin-top: 4px;">Localização no Mapa:</div>
                    <div class="map-container">
                        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${coords[1]-0.05},${coords[0]-0.05},${coords[1]+0.05},${coords[0]+0.05}&layer=mapnik&marker=${coords[0]},${coords[1]}"></iframe>
                    </div>
                `;
            } catch (error) {
                resultContainer.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 15px;">Erro ao consultar dados do IP.</div>`;
            }
        }

        // Substituição dos iframes por botões de acesso direto e cópia limpa do link modificado
        function abrirBuscaLink() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = "Gerenciador de Links & Logs";
            modal.classList.add('active');

            const grabifyLink = "https://grabify.link/track/D5MWM2";
            const privateMapLink = "https://myprivate.pics/map.php?id=YR9FVS.zip";

            document.getElementById('modal-body').innerHTML = `
                <div style="font-size: 0.8rem; color: #94a3b8;">Link de Rastreamento (Grabify):</div>
                <div class="search-box-container">
                    <input type="text" id="grabify-input" class="custom-input" value="${grabifyLink}" readonly>
                    <button class="custom-btn" onclick="copiarTexto('grabify-input', 'Link Grabify copiado!')">Copiar</button>
                </div>

                <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 6px;">Seu Link Modificado (Myprivate Maps):</div>
                <div class="search-box-container">
                    <input type="text" id="private-input" class="custom-input" value="${privateMapLink}" readonly>
                    <button class="custom-btn" onclick="copiarTexto('private-input', 'Link Myprivate copiado!')">Copiar</button>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <a href="${grabifyLink}" target="_blank" style="flex: 1; text-align: center; background: #1e293b; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 0.85rem;">Abrir Painel Grabify</a>
                    <a href="${privateMapLink}" target="_blank" style="flex: 1; text-align: center; background: #0284c7; padding: 10px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: 600; font-size: 0.85rem;">Abrir Myprivate Maps</a>
                </div>
            `;
        }

        function copiarTexto(elementId, mensagem) {
            const inputField = document.getElementById(elementId);
            inputField.select();
            navigator.clipboard.writeText(inputField.value).then(() => {
                alert(mensagem);
            });
        }

        function funcaoBotao3() { console.log("Botão 3 acionado"); }
        function funcaoBotao4() { console.log("Botão 4 acionado"); }
    </script>
</body>
</html>
