<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZRX PROJETO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; background-size: cover; background-position: center; padding-bottom: 75px; }
    
    /* Topo com Menu Lateral (3 Barrinhas) e Perfil */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.85); border-bottom: 2px solid #ff0000; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px); }
    .profile-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .profile-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ff0000; object-fit: cover; background: #222; }
    .menu-btn { background: none; border: none; color: #ff0000; font-size: 1.8rem; cursor: pointer; }

    /* Container Principal */
    .main-container { flex: 1; width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
    .tab-content { display: none; width: 100%; max-width: 450px; }
    .tab-content.active { display: flex; flex-direction: column; gap: 12px; }

    .card { width: 100%; border: 2px solid #ff0000; border-radius: 15px; padding: 25px; background: rgba(5, 5, 5, 0.9); box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); display: flex; flex-direction: column; gap: 12px; }
    
    .btn-platform { width: 100%; padding: 12px; background: #151515; border: 1px solid #444; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-platform.active { border-color: #ff0000; background: #300000; }
    
    .btn-external { width: 100%; padding: 12px; background: #ff0000; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 10px; display: block; }
    
    .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 5px; }

    .violation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 5px; }
    .btn-violation { padding: 10px; background: #222; border: 1px solid #ff0000; color: #ff0000; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    .btn-violation.selected { background: #ff0000; color: #fff; }

    input, textarea, select { width: 100%; padding: 12px; background: #111; border: 1px solid #ff0000; border-radius: 6px; color: #fff; outline: none; font-size: 0.9rem; }
    textarea { min-height: 100px; resize: vertical; }

    .btn-action { width: 100%; padding: 12px; background: #ff0000; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 5px; }

    /* Barra de Navegação Inferior */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #080808; border-top: 2px solid #ff0000; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: #888; font-size: 0.7rem; font-weight: bold; cursor: pointer; gap: 3px; }
    .nav-item span { font-size: 1.2rem; }
    .nav-item.active { color: #ff0000; }

    /* Inputs de Arquivo Escondidos */
    input[type="file"] { display: none; }

    /* Modais / Menus */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { width: 100%; max-width: 420px; background: #1a1a1a; border: 1px solid #ff0000; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }

    /* Cards de Notificação / Histórico */
    .notif-card { background: #0d0d0d; border: 1px solid #ff0000; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .notif-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #ff0000; font-weight: bold; padding-right: 20px; }
    .notif-body { font-size: 0.85rem; color: #ccc; }
    .notif-proof { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid #444; margin-top: 5px; }
    .btn-del-notif { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

    .vault-item { background: #0d0d0d; border: 1px solid #333; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; }
    .vault-item-header { display: flex; justify-content: space-between; align-items: center; }
    .vault-title { font-weight: bold; color: #ff0000; font-size: 0.9rem; }
    .btn-sm { padding: 5px 8px; background: #222; border: 1px solid #ff0000; color: #fff; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .winchester-footer { text-align: center; color: #777; font-size: 0.75rem; margin-top: 15px; font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>

  <input type="file" id="file-avatar" accept="image/*" onchange="handleFileSelect(event, 'a')">
  <input type="file" id="file-bg" accept="image/*" onchange="handleFileSelect(event, 'b')">
  <input type="file" id="file-proof" accept="image/*" onchange="handleProofUpload(event)">

  <div class="top-bar">
    <button class="menu-btn" onclick="openModal('menu-modal')">☰</button>
    <div class="profile-info" onclick="document.getElementById('file-avatar').click()" title="Toque para mudar a foto de perfil">
      <img id="display-avatar" class="profile-img" src="https://via.placeholder.com/50">
      <span id="display-username" style="font-weight:bold;">Carregando...</span>
    </div>
  </div>

  <div class="main-container">

    <div id="tab-denuncias" class="tab-content active">
      <div class="card">
        <h2 style="color:#ff0000; text-align:center; font-size: 1.2rem;">PLATAFORMAS</h2>
        
        <a href="https://6339917.igen.app/" class="btn-external">OBTER TEXTOS / APP EXTERNO</a>

        <button class="btn-platform" onclick="selectPlatform('WhatsApp', this)">WhatsApp</button>
        <button class="btn-platform" onclick="selectPlatform('Kwai', this)">Kwai</button>
        <button class="btn-platform" onclick="selectPlatform('Telegram', this)">Telegram</button>
        <button class="btn-platform" onclick="selectPlatform('Instagram', this)">Instagram</button>

        <div id="step1-area" style="display:none;" class="input-group">
          <div id="dynamic-fields" class="input-group"></div>
          <button class="btn-action" onclick="showStep2()">Selecionar Violação</button>
        </div>

        <div id="step2-area" style="display:none;" class="input-group">
          <div class="violation-grid" id="violation-btns">
            <button class="btn-violation" onclick="selectViolation('SPAM', this)">SPAM</button>
            <button class="btn-violation" onclick="selectViolation('ASSÉDIO', this)">ASSÉDIO</button>
            <button class="btn-violation" onclick="selectViolation('AMEAÇA', this)">AMEAÇA</button>
            <button class="btn-violation" onclick="selectViolation('ALICIAMENTO', this)">ALICIAMENTO</button>
            <button class="btn-violation" onclick="selectViolation('+18', this)">+18</button>
          </div>
          <textarea id="texto-denuncia" placeholder="Detalhes adicionais da denúncia..." rows="4"></textarea>
          <button class="btn-action" onclick="sendEmail()">Enviar Denúncia para Todos os E-mails</button>
        </div>
      </div>
      <div class="winchester-footer">App desenvolvido by WINCHESTER</div>
    </div>

    <div id="tab-notificacoes" class="tab-content">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 style="color:#ff0000; font-size: 1.1rem;">HISTÓRICO / NOTIFICAÇÕES</h2>
          <button class="btn-sm" onclick="clearAllNotifications()" style="border-color:#555; color:#aaa;">Limpar Tudo</button>
        </div>
        <div id="notif-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
      <div class="winchester-footer">App desenvolvido by WINCHESTER</div>
    </div>

  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-denuncias', this)">
      <span>🚨</span>
      DENÚNCIAS
    </button>
    <button class="nav-item" onclick="switchTab('tab-notificacoes', this)">
      <span>🔔</span>
      NOTIFICAÇÕES
    </button>
  </div>

  <div id="menu-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">MENU</h3>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('config-modal');">⚙️ Configurações</button>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('vault-modal');">📦 Caixa de Textos / Travas</button>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('ip-modal');">🌐 Busca de IP</button>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('email-mgr-modal');">✉️ Adicionar E-mails de Suporte</button>
      <button class="btn-sm" style="margin-top:10px;" onclick="closeModal('menu-modal')">Fechar Menu</button>
    </div>
  </div>

  <div id="config-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">Configurações</h3>
      <input type="text" id="in-name" placeholder="Nome">
      
      <button class="btn-platform" onclick="document.getElementById('file-avatar').click()">📷 Selecionar Perfil da Galeria</button>
      <button class="btn-platform" onclick="document.getElementById('file-bg').click()">🖼️ Selecionar Fundo da Galeria</button>
      
      <button class="btn-action" onclick="saveSettings()">Salvar & Reiniciar</button>
      <button class="btn-sm" onclick="closeModal('config-modal')">Voltar</button>
    </div>
  </div>

  <div id="vault-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">Caixa de Textos / Travas</h3>
      
      <input type="text" id="vault-title-in" placeholder="Nome da Caixa (ex: Trava 1, Texto Spam)">
      <textarea id="vault-text-in" placeholder="Cole seu texto ou trava aqui..." rows="3"></textarea>
      <button class="btn-action" onclick="addVaultItem()">Salvar Novo Texto</button>

      <hr style="border-color:#333; margin: 5px 0;">

      <div id="vault-list" style="display:flex; flex-direction:column; gap:8px;"></div>

      <button class="btn-sm" onclick="closeModal('vault-modal')" style="margin-top:5px;">Voltar</button>
    </div>
  </div>

  <div id="ip-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">🌐 BUSCA DE IP</h3>
      <input type="text" id="ip-input" placeholder="Digite o IP (ex: 8.8.8.8)">
      <div style="display:flex; gap:8px;">
        <button class="btn-action" style="flex:2;" onclick="searchIP()">Buscar IP</button>
        <button class="btn-platform" style="flex:1;" onclick="searchMyIP()">Meu IP</button>
      </div>
      <div id="ip-results" style="background:#0a0a0a; border:1px solid #ff0000; padding:12px; border-radius:6px; font-size:0.85rem; color:#ccc; display:none;"></div>
      <button class="btn-sm" onclick="closeModal('ip-modal')">Voltar</button>
    </div>
  </div>

  <div id="email-mgr-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">✉️ ADICIONAR E-MAILS</h3>
      <select id="email-plat-select">
        <option value="WhatsApp">WhatsApp</option>
        <option value="Kwai">Kwai</option>
        <option value="Telegram">Telegram</option>
        <option value="Instagram">Instagram</option>
      </select>
      <textarea id="email-list-input" placeholder="Cole os e-mails aqui (separados por vírgula)..."></textarea>
      <button class="btn-action" onclick="saveCustomEmails()">Adicionar E-mails</button>
      <button class="btn-sm" onclick="resetEmailsForSelected()" style="border-color:#555; color:#aaa;">Restaurar E-mails Padrão</button>
      <hr style="border-color:#333;">
      <div id="current-emails-display" style="font-size:0.8rem; color:#aaa; max-height:120px; overflow-y:auto;"></div>
      <button class="btn-sm" onclick="closeModal('email-mgr-modal')">Voltar</button>
    </div>
  </div>

  <script>
    let currentPlatform = '';
    let selectedViolation = '';
    let activeNotifIndexForProof = null;
    
    const baseEmailData = {
      'WhatsApp': ['support@whatsapp.com', 'legal@whatsapp.com', 'abuso@whatsapp.com', 'press@whatsapp.com'],
      'Kwai': ['Report@kwai.com', 'customer-servicer@kwai.com', 'comcustomer-service@kwai.com', 'customer-service@kwai.com', 'support@kuaishousupport.freshdesk.com'],
      'Telegram': ['support@telegram.org', 'abuse@telegram.org', 'recover@telegram.org', 'sms@telegram.org'],
      'Instagram': ['support@instagram.com', 'phish@instagram.com', 'abuse@instagram.com', 'privacy@instagram.com']
    };

    let emailData = JSON.parse(JSON.stringify(baseEmailData));

    function loadEmails() {
      emailData = JSON.parse(JSON.stringify(baseEmailData));
      const saved = localStorage.getItem('zrx_custom_emails');
      if (saved) {
        const parsed = JSON.parse(saved);
        for (let p in parsed) {
          if (emailData[p]) {
            emailData[p] = Array.from(new Set([...emailData[p], ...parsed[p]]));
          } else {
            emailData[p] = parsed[p];
          }
        }
      }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function handleFileSelect(event, key) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem(key, e.target.result);
          if (key === 'a') document.getElementById('display-avatar').src = e.target.result;
          if (key === 'b') document.body.style.backgroundImage = `url('${e.target.result}')`;
        };
        reader.readAsDataURL(file);
      }
    }

    function selectPlatform(p, btn) {
      currentPlatform = p;
      document.querySelectorAll('.btn-platform').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      else if(event && event.target) event.target.classList.add('active');
      
      document.getElementById('step1-area').style.display = 'flex';
      document.getElementById('step2-area').style.display = 'none';
      const container = document.getElementById('dynamic-fields');
      container.innerHTML = (p === 'Kwai') ? 
        '<input type="text" id="field-alvo" placeholder="ID DO ALVO:"><input type="text" id="field-kwai-id" placeholder="MEU KWAI.ID:">' :
        '<input type="text" id="field-alvo" placeholder="ID / LINK DO ALVO:">';
    }

    function selectViolation(v, btn) {
      selectedViolation = v;
      document.querySelectorAll('.btn-violation').forEach(b => b.classList.remove('selected'));
      if(btn) btn.classList.add('selected');
      else if(event && event.target) event.target.classList.add('selected');
    }

    function showStep2() { 
      const alvo = document.getElementById('field-alvo').value;
      if (!alvo) {
        alert('Por favor, informe o ID/Link do alvo!');
        return;
      }
      document.getElementById('step2-area').style.display = 'flex'; 
    }
    
    function sendEmail() {
      const alvo = document.getElementById('field-alvo').value;
      const kwai = document.getElementById('field-kwai-id') ? document.getElementById('field-kwai-id').value : '';
      const texto = document.getElementById('texto-denuncia').value;

      if(!selectedViolation) { 
        alert('Selecione uma violação!'); 
        return; 
      }

      loadEmails();
      const emails = emailData[currentPlatform] || [];
      if(emails.length === 0) { alert('Nenhum e-mail cadastrado!'); return; }

      const emailPrincipal = emails[0];
      const emailsCopia = emails.slice(1).join(',');

      const assunto = `Denúncia ${currentPlatform} - ${selectedViolation}`;
      const corpo = `Plataforma: ${currentPlatform}\nViolação: ${selectedViolation}\nAlvo: ${alvo}\n${kwai ? 'Meu ID: '+kwai+'\n' : ''}\nDetalhes:\n${texto}`;

      const mailtoUrl = `mailto:${emailPrincipal}?cc=${encodeURIComponent(emailsCopia)}&subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

      addNotification({
        platform: currentPlatform,
        alvo: alvo,
        violation: selectedViolation,
        date: new Date().toLocaleString('pt-BR'),
        status: 'Denúncia Enviada',
        proof: null
      });

      document.getElementById('field-alvo').value = '';
      if(document.getElementById('field-kwai-id')) document.getElementById('field-kwai-id').value = '';
      document.getElementById('texto-denuncia').value = '';

      window.location.href = mailtoUrl;
    }

    // Lógica das Notificações
    function getNotifications() {
      return JSON.parse(localStorage.getItem('zrx_notifs') || '[]');
    }

    function addNotification(item) {
      const notifs = getNotifications();
      notifs.unshift(item);
      localStorage.setItem('zrx_notifs', JSON.stringify(notifs));
      renderNotifications();
    }

    function deleteNotification(index) {
      const notifs = getNotifications();
      notifs.splice(index, 1);
      localStorage.setItem('zrx_notifs', JSON.stringify(notifs));
      renderNotifications();
    }

    function clearAllNotifications() {
      if(confirm('Deseja limpar todo o histórico de notificações?')) {
        localStorage.removeItem('zrx_notifs');
        renderNotifications();
      }
    }

    function renderNotifications() {
      const notifs = getNotifications();
      const container = document.getElementById('notif-list');
      if(!container) return;
      container.innerHTML = '';

      if (notifs.length === 0) {
        container.innerHTML = '<span style="color:#666; text-align:center; font-size:0.85rem;">Nenhuma denúncia registrada ainda.</span>';
        return;
      }

      notifs.forEach((n, idx) => {
        container.innerHTML += `
          <div class="notif-card">
            <button class="btn-del-notif" onclick="deleteNotification(${idx})">✕</button>
            <div class="notif-header">
              <span>🚨 ${n.platform} - ${n.violation}</span>
              <span>${n.date}</span>
            </div>
            <div class="notif-body">
              <strong>Alvo:</strong> ${n.alvo}<br>
              <strong>Status:</strong> <span style="color:#00ff00;">${n.status}</span>
            </div>
            ${n.proof ? `<img src="${n.proof}" class="notif-proof">` : ''}
            <button class="btn-sm" style="margin-top:5px;" onclick="triggerProofUpload(${idx})">📷 ${n.proof ? 'Alterar Prova (Print)' : 'Anexar Prova (Print)'}</button>
          </div>
        `;
      });
    }

    function triggerProofUpload(index) {
      activeNotifIndexForProof = index;
      document.getElementById('file-proof').click();
    }

    function handleProofUpload(event) {
      const file = event.target.files[0];
      if (file && activeNotifIndexForProof !== null) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const notifs = getNotifications();
          notifs[activeNotifIndexForProof].proof = e.target.result;
          localStorage.setItem('zrx_notifs', JSON.stringify(notifs));
          renderNotifications();
        };
        reader.readAsDataURL(file);
      }
    }

    // Lógica Busca de IP
    function searchIP() {
      const ip = document.getElementById('ip-input').value.trim();
      if(!ip) { alert('Digite um IP!'); return; }
      fetchIPDetails(`https://ipinfo.io/${ip}/json`);
    }

    function searchMyIP() {
      fetchIPDetails(`https://ipinfo.io/json`);
    }

    function fetchIPDetails(url) {
      const resContainer = document.getElementById('ip-results');
      resContainer.style.display = 'block';
      resContainer.innerHTML = 'Carregando dados do IP...';

      fetch(url)
        .then(res => res.json())
        .then(data => {
          resContainer.innerHTML = `
            <strong>🌐 IP:</strong> ${data.ip || 'N/A'}<br>
            <strong>🏳️ País:</strong> ${data.country || 'N/A'}<br>
            <strong>📍 Região/Cidade:</strong> ${data.region || ''} - ${data.city || 'N/A'}<br>
            <strong>🏢 Provedor:</strong> ${data.org || 'N/A'}<br>
            <strong>🗺️ Coordenadas:</strong> ${data.loc || 'N/A'}<br>
            <strong>🕒 Fuso Horário:</strong> ${data.timezone || 'N/A'}
          `;
        })
        .catch(() => {
          resContainer.innerHTML = '<span style="color:#ff0000;">Erro ao buscar dados do IP.</span>';
        });
    }

    // Gerenciador de E-mails
    function saveCustomEmails() {
      const plat = document.getElementById('email-plat-select').value;
      const raw = document.getElementById('email-list-input').value;
      if(!raw) return;

      const newEmails = raw.split(',').map(e => e.trim()).filter(e => e.length > 0);
      const saved = JSON.parse(localStorage.getItem('zrx_custom_emails') || '{}');
      saved[plat] = Array.from(new Set([...(saved[plat] || []), ...newEmails]));
      
      localStorage.setItem('zrx_custom_emails', JSON.stringify(saved));
      document.getElementById('email-list-input').value = '';
      loadEmails();
      displayCurrentEmails();
      alert('E-mails adicionados com sucesso!');
    }

    function resetEmailsForSelected() {
      const plat = document.getElementById('email-plat-select').value;
      const saved = JSON.parse(localStorage.getItem('zrx_custom_emails') || '{}');
      delete saved[plat];
      localStorage.setItem('zrx_custom_emails', JSON.stringify(saved));
      loadEmails();
      displayCurrentEmails();
      alert(`E-mails de ${plat} restaurados para o padrão.`);
    }

    function displayCurrentEmails() {
      loadEmails();
      const plat = document.getElementById('email-plat-select').value;
      const display = document.getElementById('current-emails-display');
      display.innerHTML = `<strong>E-mails atuais para ${plat}:</strong><br>` + (emailData[plat] ? emailData[plat].join('<br>') : 'Nenhum');
    }

    if(document.getElementById('email-plat-select')) {
      document.getElementById('email-plat-select').addEventListener('change', displayCurrentEmails);
    }

    function openModal(id) { 
      document.getElementById(id).style.display = 'flex'; 
      if(id === 'email-mgr-modal') displayCurrentEmails();
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function saveSettings() {
      localStorage.setItem('n', document.getElementById('in-name').value);
      location.reload();
    }

    /* Lógica da Caixa de Textos / Travas */
    function getVault() {
      return JSON.parse(localStorage.getItem('zrx_vault') || '[]');
    }

    function renderVault() {
      const vault = getVault();
      const list = document.getElementById('vault-list');
      if(!list) return;
      list.innerHTML = '';
      
      if(vault.length === 0) {
        list.innerHTML = '<span style="color:#666; text-align:center; font-size:0.8rem;">Nenhum item salvo ainda.</span>';
        return;
      }

      vault.forEach((item, index) => {
        list.innerHTML += `
          <div class="vault-item">
            <div class="vault-item-header">
              <span class="vault-title">${item.title}</span>
              <div>
                <button class="btn-sm" onclick="copyVault(${index})">Copiar</button>
                <button class="btn-sm" onclick="deleteVault(${index})" style="border-color:#555; color:#aaa;">X</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function addVaultItem() {
      const title = document.getElementById('vault-title-in').value;
      const text = document.getElementById('vault-text-in').value;
      if(!title || !text) { alert('Preencha o nome e o texto!'); return; }
      
      const vault = getVault();
      vault.push({ title, text });
      localStorage.setItem('zrx_vault', JSON.stringify(vault));
      
      document.getElementById('vault-title-in').value = '';
      document.getElementById('vault-text-in').value = '';
      renderVault();
    }

    function copyVault(index) {
      const vault = getVault();
      navigator.clipboard.writeText(vault[index].text);
      alert('Texto "' + vault[index].title + '" copiado com sucesso!');
    }

    function deleteVault(index) {
      const vault = getVault();
      vault.splice(index, 1);
      localStorage.setItem('zrx_vault', JSON.stringify(vault));
      renderVault();
    }
    
    window.onload = () => {
      loadEmails();
      const n = localStorage.getItem('n');
      if(!n) openModal('config-modal');
      document.getElementById('display-username').innerText = n || 'Usuário';
      document.getElementById('in-name').value = n || '';
      document.getElementById('display-avatar').src = localStorage.getItem('a') || 'https://via.placeholder.com/50';
      if(localStorage.getItem('b')) document.body.style.backgroundImage = `url('${localStorage.getItem('b')}')`;
      renderVault();
      renderNotifications();
    };
  </script>
</body>
</html>
