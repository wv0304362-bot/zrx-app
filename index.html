<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Cyber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }

        /* Topo: Banner de Imagem ou Vídeo */
        .banner-container {
            width: 100%;
            height: 160px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
        }

        .banner-container img, 
        .banner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.9));
        }

        .content-body {
            padding: 16px;
            margin-top: -30px;
            position: relative;
            z-index: 2;
        }

        /* Perfil Centralizado */
        .profile-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .profile-avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #0284c7;
            overflow: hidden;
            border: 2px solid #38bdf8;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h2 {
            font-size: 1rem;
            color: #f8fafc;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .profile-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.4);
        }

        /* Grade de Botões 2x2 */
        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-card:active {
            transform: scale(0.97);
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
        }

        .action-icon {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .action-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Rodapé de Avisos / Status */
        .footer-status {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Banner Superior (Trocar src para imagem ou usar tag <video> se preferir) -->
        <div class="banner-container">
            <!-- Exemplo com imagem (pode trocar por vídeo depois) -->
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" alt="Banner do App">
            <div class="banner-overlay"></div>
        </div>

        <div class="content-body">
            
            <!-- Bloco do Perfil Centralizado -->
            <div class="profile-card">
                <div class="profile-avatar">
                    <!-- Foto de perfil da pessoa -->
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop" alt="Avatar">
                </div>
                <div class="profile-info">
                    <h2 id="user-name">SEU NOME</h2>
                    <span class="profile-badge">ROLE: DEVELOPER</span>
                </div>
            </div>

            <!-- Grade de Botões 2x2 -->
            <div class="grid-2x2">
                <!-- Botão 1 -->
                <div class="action-card" onclick="funcaoBotao1()">
                    <div class="action-icon">⚡</div>
                    <div class="action-title">Função 01</div>
                    <div class="action-desc">Descrição curta</div>
                </div>

                <!-- Botão 2 -->
                <div class="action-card" onclick="funcaoBotao2()">
                    <div class="action-icon">🔧</div>
                    <div class="action-title">Função 02</div>
                    <div class="action-desc">Descrição curta</div>
                </div>

                <!-- Botão 3 -->
                <div class="action-card" onclick="funcaoBotao3()">
                    <div class="action-icon">📊</div>
                    <div class="action-title">Função 03</div>
                    <div class="action-desc">Descrição curta</div>
                </div>

                <!-- Botão 4 -->
                <div class="action-card" onclick="funcaoBotao4()">
                    <div class="action-icon">🚀</div>
                    <div class="action-title">Função 04</div>
                    <div class="action-desc">Descrição curta</div>
                </div>
            </div>

            <!-- Rodapé / Info -->
            <div class="footer-status">
                Status: Sistema Operacional Online
            </div>

        </div>
    </div>

    <script>
        // Funções independentes para cada botão (por enquanto vazias)
        function funcaoBotao1() {
            console.log("Botão 1 clicado");
            // Adicione sua lógica aqui
        }

        function funcaoBotao2() {
            console.log("Botão 2 clicado");
            // Adicione sua lógica aqui
        }

        function funcaoBotao3() {
            console.log("Botão 3 clicado");
            // Adicione sua lógica aqui
        }

        function funcaoBotao4() {
            console.log("Botão 4 clicado");
            // Adicione sua lógica aqui
        }
    </script>
</body>
</html>
