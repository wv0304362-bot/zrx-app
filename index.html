<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Cyber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Tela cheia total */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topo: Banner de Imagem ou Vídeo (Tela cheia na largura) */
        .banner-container {
            width: 100%;
            height: 200px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .banner-container img, 
        .banner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.95));
        }

        .content-body {
            padding: 16px;
            margin-top: -35px;
            position: relative;
            z-index: 2;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Perfil Centralizado */
        .profile-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #0284c7;
            overflow: hidden;
            border: 2px solid #38bdf8;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h2 {
            font-size: 1.05rem;
            color: #f8fafc;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .profile-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: rgba(2, 132, 199, 0.25);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.4);
            font-weight: 600;
        }

        /* Grade de Botões 2x2 */
        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-card:active {
            transform: scale(0.96);
            background: rgba(30, 41, 59, 0.95);
            border-color: #38bdf8;
        }

        .action-icon-wrapper {
            width: 36px;
            height: 36px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* Estilização dos vetores SVG (Símbolos desenhados) */
        .action-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: #38bdf8;
        }

        .action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .action-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Rodapé de Status */
        .footer-status {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Topo: Banner (Pode usar <img> ou trocar por <video autoplay muted loop playsinline>) -->
        <div class="banner-container">
            <img id="banner-media" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" alt="Banner do App">
            <div class="banner-overlay"></div>
        </div>

        <div class="content-body">
            
            <!-- Bloco do Perfil Centralizado -->
            <div class="profile-card">
                <div class="profile-avatar">
                    <img id="profile-avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop" alt="Avatar">
                </div>
                <div class="profile-info">
                    <h2 id="user-name">SEU NOME</h2>
                    <span id="user-role" class="profile-badge">ROLE: DEVELOPER</span>
                </div>
            </div>

            <!-- Grade de Botões 2x2 (Com símbolos vetoriais sem emojis) -->
            <div class="grid-2x2">
                
                <!-- Botão 1: Raio -->
                <div class="action-card" onclick="funcaoBotao1()">
                    <div class="action-icon-wrapper">
                        <!-- Símbolo de Raio Desenhado -->
                        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 01</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 2: Ferramenta / Chave inglesa -->
                <div class="action-card" onclick="funcaoBotao2()">
                    <div class="action-icon-wrapper">
                        <!-- Símbolo de Ferramenta Desenhado -->
                        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 02</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 3: Gráfico / Estatística -->
                <div class="action-card" onclick="funcaoBotao3()">
                    <div class="action-icon-wrapper">
                        <!-- Símbolo de Gráfico Desenhado -->
                        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 03</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 4: Foguete / Lançamento -->
                <div class="action-card" onclick="funcaoBotao4()">
                    <div class="action-icon-wrapper">
                        <!-- Símbolo de Foguete Desenhado -->
                        <svg viewBox="0 0 24 24"><path d="M12 2.5s5 2 5 9.5c0 3.5-1.5 6-3 7l-2 3-2-3c-1.5-1-3-3.5-3-7 0-7.5 5-9.5 5-9.5zm0 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 04</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

            </div>

            <!-- Rodapé / Status -->
            <div class="footer-status">
                Status: Sistema Operacional Online
            </div>

        </div>
    </div>

    <script>
        // Funções independentes para cada botão
        function funcaoBotao1() {
            console.log("Função do Raio acionada");
        }

        function funcaoBotao2() {
            console.log("Função da Ferramenta acionada");
        }

        function funcaoBotao3() {
            console.log("Função do Gráfico acionada");
        }

        function funcaoBotao4() {
            console.log("Função do Foguete acionada");
        }
    </script>
</body>
</html>
