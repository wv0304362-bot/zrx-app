<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZRX PROJETO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; background-size: cover; background-position: center; }
    
    /* Topo com Menu Lateral (3 Barrinhas) e Perfil */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.85); border-bottom: 2px solid #ff0000; }
    .profile-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .profile-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ff0000; object-fit: cover; background: #222; }
    .menu-btn { background: none; border: none; color: #ff0000; font-size: 1.8rem; cursor: pointer; }

    /* Container Principal */
    .main-container { flex: 1; width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 450px; border: 2px solid #ff0000; border-radius: 15px; padding: 25px; background: rgba(5, 5, 5, 0.9); box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); display: flex; flex-direction: column; gap: 12px; }
    
    .btn-platform { width: 100%; padding: 12px; background: #151515; border: 1px solid #444; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-platform.active { border-color: #ff0000; background: #300000; }
    
    .btn-external { width: 100%; padding: 12px; background: #ff0000; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 10px; display: block; }
    
    .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 5px; }

    .violation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 5px; }
    .btn-violation { padding: 10px; background: #222; border: 1px solid #ff0000; color: #ff0000; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    .btn-violation.selected { background: #ff0000; color: #fff; }

    input, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #ff0000; border-radius: 6px; color: #fff; outline: none; font-size: 0.9rem; }
    textarea { min-height: 100px; resize: vertical; }

    .btn-action { width: 100%; padding: 12px; background: #ff0000; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 5px; }

    /* Inputs de Arquivo Escondidos */
    input[type="file"] { display: none; }

    /* Modais / Menus */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { width: 100%; max-width: 420px; background: #1a1a1a; border: 1px solid #ff0000; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }

    .vault-item { background: #0d0d0d; border: 1px solid #333; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; }
    .vault-item-header { display: flex; justify-content: space-between; align-items: center; }
    .vault-title { font-weight: bold; color: #ff0000; font-size: 0.9rem; }
    .btn-sm { padding: 5px 8px; background: #222; border: 1px solid #ff0000; color: #fff; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
  </style>
</head>
<body>

  <!-- Inputs invisíveis para acionar a galeria do celular -->
  <input type="file" id="file-avatar" accept="image/*" onchange="handleFileSelect(event, 'a')">
  <input type="file" id="file-bg" accept="image/*" onchange="handleFileSelect(event, 'b')">

  <div class="top-bar">
    <button class="menu-btn" onclick="openModal('menu-modal')">☰</button>
    <div class="profile-info" onclick="document.getElementById('file-avatar').click()" title="Toque para mudar a foto de perfil">
      <img id="display-avatar" class="profile-img" src="https://via.placeholder.com/50">
      <span id="display-username" style="font-weight:bold;">Carregando...</span>
    </div>
  </div>

  <div class="main-container">
    <div class="card">
      <h2 style="color:#ff0000; text-align:center; font-size: 1.2rem;">PLATAFORMAS</h2>
      
      <a href="https://6339917.igen.app/" class="btn-external">OBTER TEXTOS / APP EXTERNO</a>

      <button class="btn-platform" onclick="selectPlatform('WhatsApp')">WhatsApp</button>
      <button class="btn-platform" onclick="selectPlatform('Kwai')">Kwai</button>
      <button class="btn-platform" onclick="selectPlatform('Telegram')">Telegram</button>
      <button class="btn-platform" onclick="selectPlatform('Instagram')">Instagram</button>

      <div id="step1-area" style="display:none;" class="input-group">
        <div id="dynamic-fields" class="input-group"></div>
        <button class="btn-action" onclick="showStep2()">Selecionar Violação</button>
      </div>

      <div id="step2-area" style="display:none;" class="input-group">
        <div class="violation-grid" id="violation-btns">
          <button class="btn-violation" onclick="selectViolation('SPAM')">SPAM</button>
          <button class="btn-violation" onclick="selectViolation('ASSÉDIO')">ASSÉDIO</button>
          <button class="btn-violation" onclick="selectViolation('AMEAÇA')">AMEAÇA</button>
          <button class="btn-violation" onclick="selectViolation('ALICIAMENTO')">ALICIAMENTO</button>
          <button class="btn-violation" onclick="selectViolation('+18')">+18</button>
        </div>
        <textarea id="texto-denuncia" placeholder="Detalhes adicionais da denúncia..." rows="4"></textarea>
        <button class="btn-action" onclick="sendEmail()">Enviar Denúncia para Todos os E-mails</button>
      </div>
    </div>
  </div>

  <!-- Modal do Menu Lateral (3 Barrinhas) -->
  <div id="menu-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">MENU</h3>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('config-modal');">⚙️ Configurações</button>
      <button class="btn-action" onclick="closeModal('menu-modal'); openModal('vault-modal');">📦 Caixa de Textos / Travas</button>
      <button class="btn-sm" style="margin-top:10px;" onclick="closeModal('menu-modal')">Fechar Menu</button>
    </div>
  </div>

  <!-- Modal Configurações -->
  <div id="config-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">Configurações</h3>
      <input type="text" id="in-name" placeholder="Nome">
      
      <button class="btn-platform" onclick="document.getElementById('file-avatar').click()">📷 Selecionar Perfil da Galeria</button>
      <button class="btn-platform" onclick="document.getElementById('file-bg').click()">🖼️ Selecionar Fundo da Galeria</button>
      
      <button class="btn-action" onclick="saveSettings()">Salvar & Reiniciar</button>
      <button class="btn-sm" onclick="closeModal('config-modal')">Voltar</button>
    </div>
  </div>

  <!-- Modal Caixa de Textos / Travas -->
  <div id="vault-modal" class="modal">
    <div class="modal-content">
      <h3 style="color:#ff0000; text-align:center;">Caixa de Textos / Travas</h3>
      
      <!-- Form para Adicionar -->
      <input type="text" id="vault-title-in" placeholder="Nome da Caixa (ex: Trava 1, Texto Spam)">
      <textarea id="vault-text-in" placeholder="Cole seu texto ou trava aqui..." rows="3"></textarea>
      <button class="btn-action" onclick="addVaultItem()">Salvar Novo Texto</button>

      <hr style="border-color:#333; margin: 5px 0;">

      <!-- Lista de Salvos -->
      <div id="vault-list" style="display:flex; flex-direction:column; gap:8px;"></div>

      <button class="btn-sm" onclick="closeModal('vault-modal')" style="margin-top:5px;">Voltar</button>
    </div>
  </div>

  <script>
    let currentPlatform = '';
    let selectedViolation = '';
    
    const emailData = {
      'WhatsApp': ['support@whatsapp.com', 'legal@whatsapp.com', 'abuso@whatsapp.com', 'press@whatsapp.com'],
      'Kwai': ['Report@kwai.com', 'customer-servicer@kwai.com', 'comcustomer-service@kwai.com', 'customer-service@kwai.com', 'support@kuaishousupport.freshdesk.com'],
      'Telegram': ['support@telegram.org', 'abuse@telegram.org', 'recover@telegram.org', 'sms@telegram.org'],
      'Instagram': ['support@instagram.com', 'phish@instagram.com', 'abuse@instagram.com', 'privacy@instagram.com']
    };

    function handleFileSelect(event, key) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem(key, e.target.result);
          if (key === 'a') document.getElementById('display-avatar').src = e.target.result;
          if (key === 'b') document.body.style.backgroundImage = `url('${e.target.result}')`;
        };
        reader.readAsDataURL(file);
      }
    }

    function selectPlatform(p) {
      currentPlatform = p;
      document.querySelectorAll('.btn-platform').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('step1-area').style.display = 'flex';
      document.getElementById('step2-area').style.display = 'none';
      const container = document.getElementById('dynamic-fields');
      container.innerHTML = (p === 'Kwai') ? 
        '<input type="text" id="field-alvo" placeholder="ID DO ALVO:"><input type="text" id="field-kwai-id" placeholder="MEU KWAI.ID:">' :
        '<input type="text" id="field-alvo" placeholder="ID / LINK DO ALVO:">';
    }

    function selectViolation(v) {
      selectedViolation = v;
      document.querySelectorAll('.btn-violation').forEach(b => b.classList.remove('selected'));
      event.target.classList.add('selected');
    }

    function showStep2() { 
      const alvo = document.getElementById('field-alvo').value;
      if (!alvo) {
        alert('Por favor, informe o ID/Link do alvo!');
        return;
      }
      document.getElementById('step2-area').style.display = 'flex'; 
    }
    
    function sendEmail() {
      const alvo = document.getElementById('field-alvo').value;
      const kwai = document.getElementById('field-kwai-id') ? document.getElementById('field-kwai-id').value : '';
      const texto = document.getElementById('texto-denuncia').value;

      if(!selectedViolation) { 
        alert('Selecione uma violação!'); 
        return; 
      }

      // Concatena todos os e-mails da plataforma selecionada com vírgula
      const allEmails = emailData[currentPlatform].join(',');

      window.location.href = `mailto:${allEmails}?subject=Denuncia ${currentPlatform} - ${selectedViolation}&body=Plataforma: ${currentPlatform}%0D%0AViolação: ${selectedViolation}%0D%0AAlvo: ${alvo}%0D%0A${kwai ? 'Meu ID: '+kwai+'%0D%0A' : ''}%0D%0ADetalhes:%0D%0A${texto}`;
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function saveSettings() {
      localStorage.setItem('n', document.getElementById('in-name').value);
      location.reload();
    }

    /* Lógica da Caixa de Textos / Travas */
    function getVault() {
      return JSON.parse(localStorage.getItem('zrx_vault') || '[]');
    }

    function renderVault() {
      const vault = getVault();
      const list = document.getElementById('vault-list');
      list.innerHTML = '';
      
      if(vault.length === 0) {
        list.innerHTML = '<span style="color:#666; text-align:center; font-size:0.8rem;">Nenhum item salvo ainda.</span>';
        return;
      }

      vault.forEach((item, index) => {
        list.innerHTML += `
          <div class="vault-item">
            <div class="vault-item-header">
              <span class="vault-title">${item.title}</span>
              <div>
                <button class="btn-sm" onclick="copyVault(${index})">Copiar</button>
                <button class="btn-sm" onclick="deleteVault(${index})" style="border-color:#555; color:#aaa;">X</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function addVaultItem() {
      const title = document.getElementById('vault-title-in').value;
      const text = document.getElementById('vault-text-in').value;
      if(!title || !text) { alert('Preencha o nome e o texto!'); return; }
      
      const vault = getVault();
      vault.push({ title, text });
      localStorage.setItem('zrx_vault', JSON.stringify(vault));
      
      document.getElementById('vault-title-in').value = '';
      document.getElementById('vault-text-in').value = '';
      renderVault();
    }

    function copyVault(index) {
      const vault = getVault();
      navigator.clipboard.writeText(vault[index].text);
      alert('Texto "' + vault[index].title + '" copiado com sucesso!');
    }

    function deleteVault(index) {
      const vault = getVault();
      vault.splice(index, 1);
      localStorage.setItem('zrx_vault', JSON.stringify(vault));
      renderVault();
    }
    
    window.onload = () => {
      const n = localStorage.getItem('n');
      if(!n) openModal('config-modal');
      document.getElementById('display-username').innerText = n || 'Usuário';
      document.getElementById('in-name').value = n || '';
      document.getElementById('display-avatar').src = localStorage.getItem('a') || 'https://via.placeholder.com/50';
      if(localStorage.getItem('b')) document.body.style.backgroundImage = `url('${localStorage.getItem('b')}')`;
      renderVault();
    };
  </script>
</body>
</html>
