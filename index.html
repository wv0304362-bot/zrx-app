<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Cyber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Tela cheia total */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topo: Banner de Imagem ou Vídeo */
        .banner-container {
            width: 100%;
            height: 210px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .banner-container img, 
        .banner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.95));
            pointer-events: none;
            z-index: 2;
        }

        /* Botão de + Grande no Banner */
        .banner-upload-btn {
            position: relative;
            z-index: 3;
            background: rgba(15, 23, 42, 0.7);
            border: 2px dashed #38bdf8;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .banner-upload-btn.hidden {
            display: none;
        }

        .banner-upload-btn:active {
            transform: scale(0.92);
            background: rgba(56, 189, 248, 0.3);
        }

        .banner-upload-btn svg {
            width: 32px;
            height: 32px;
            fill: #38bdf8;
        }

        .content-body {
            padding: 16px;
            margin-top: -35px;
            position: relative;
            z-index: 4;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Perfil Centralizado */
        .profile-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .profile-avatar-container {
            position: relative;
            width: 65px;
            height: 65px;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            background: #1e293b;
            overflow: hidden;
            border: 2px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Placeholder inicial para o avatar vazio */
        .profile-avatar svg {
            width: 28px;
            height: 28px;
            fill: #64748b;
        }

        /* Botão + pequeno na foto de perfil */
        .avatar-upload-overlay {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #0284c7;
            border: 2px solid #0f172a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .avatar-upload-overlay svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .profile-info {
            flex-grow: 1;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .profile-info h2 {
            font-size: 1.05rem;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        /* Ícone de Lápis vetorizado */
        .edit-icon {
            width: 14px;
            height: 14px;
            fill: #94a3b8;
        }

        .profile-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: rgba(2, 132, 199, 0.25);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.4);
            font-weight: 600;
        }

        /* Grade de Botões 2x2 */
        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-card:active {
            transform: scale(0.96);
            background: rgba(30, 41, 59, 0.95);
            border-color: #38bdf8;
        }

        .action-icon-wrapper {
            width: 36px;
            height: 36px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .action-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: #38bdf8;
        }

        .action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .action-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Rodapé de Status */
        .footer-status {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: auto;
        }

        /* Inputs ocultos para carregar arquivos */
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Topo: Banner com botão + centralizado (clicar no banner também abre o seletor) -->
        <div class="banner-container" id="banner-container" onclick="document.getElementById('banner-file-input').click()">
            <div class="banner-overlay"></div>
            <!-- Botão de + Grande para alterar imagem/vídeo do banner -->
            <div class="banner-upload-btn" id="banner-upload-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <input type="file" id="banner-file-input" class="hidden-input" accept="image/*,video/*" onchange="carregarBanner(event)">
        </div>

        <div class="content-body">
            
            <!-- Bloco do Perfil Centralizado -->
            <div class="profile-card">
                <div class="profile-avatar-container">
                    <div class="profile-avatar" id="profile-avatar">
                        <!-- Ícone genérico inicial caso não tenha foto -->
                        <svg id="avatar-placeholder-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <!-- Botão + na foto de perfil -->
                    <div class="avatar-upload-overlay" onclick="document.getElementById('avatar-file-input').click()">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                    <input type="file" id="avatar-file-input" class="hidden-input" accept="image/*" onchange="carregarAvatar(event)">
                </div>

                <div class="profile-info">
                    <!-- Área do nome com opção de clique para editar -->
                    <div class="name-wrapper" onclick="editarNome()">
                        <h2 id="user-name">DEFINIR NOME</h2>
                        <svg class="edit-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>
                    <span id="user-role" class="profile-badge">ROLE: USER</span>
                </div>
            </div>

            <!-- Grade de Botões 2x2 -->
            <div class="grid-2x2">
                
                <!-- Botão 1: Raio -->
                <div class="action-card" onclick="funcaoBotao1()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 01</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 2: Ferramenta -->
                <div class="action-card" onclick="funcaoBotao2()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 02</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 3: Gráfico -->
                <div class="action-card" onclick="funcaoBotao3()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 03</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

                <!-- Botão 4: Foguete -->
                <div class="action-card" onclick="funcaoBotao4()">
                    <div class="action-icon-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M12 2.5s5 2 5 9.5c0 3.5-1.5 6-3 7l-2 3-2-3c-1.5-1-3-3.5-3-7 0-7.5 5-9.5 5-9.5zm0 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                    </div>
                    <div>
                        <div class="action-title">Função 04</div>
                        <div class="action-desc">Descrição curta</div>
                    </div>
                </div>

            </div>

            <!-- Rodapé / Status -->
            <div class="footer-status">
                Status: Sistema Operacional Online
            </div>

        </div>
    </div>

    <script>
        // Carrega dados salvos ao iniciar o app
        window.onload = function() {
            const savedName = localStorage.getItem('userName');
            if (savedName) {
                document.getElementById('user-name').textContent = savedName;
            }

            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) {
                aplicarAvatar(savedAvatar);
            }

            const savedBanner = localStorage.getItem('userBanner');
            const savedBannerType = localStorage.getItem('userBannerType');
            if (savedBanner) {
                aplicarBanner(savedBanner, savedBannerType === 'video');
            }
        };

        // Função para carregar imagem ou vídeo no banner
        function carregarBanner(event) {
            event.stopPropagation(); // Evita conflito com o clique do container
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                const isVideo = file.type.startsWith('video');
                
                // Salva no localStorage
                localStorage.setItem('userBanner', fileURL);
                localStorage.setItem('userBannerType', isVideo ? 'video' : 'image');

                aplicarBanner(fileURL, isVideo);
            };
            reader.readAsDataURL(file);
        }

        function aplicarBanner(url, isVideo) {
            const bannerContainer = document.getElementById('banner-container');
            const uploadBtn = document.getElementById('banner-upload-btn');
            
            // Remove mídia anterior se existir
            const oldMedia = bannerContainer.querySelector('img, video');
            if (oldMedia) oldMedia.remove();

            if (isVideo) {
                const video = document.createElement('video');
                video.src = url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                bannerContainer.insertBefore(video, bannerContainer.firstChild);
            } else {
                const img = document.createElement('img');
                img.src = url;
                bannerContainer.insertBefore(img, bannerContainer.firstChild);
            }

            // Esconde o botão de mais após a mídia ser inserida
            uploadBtn.classList.add('hidden');
        }

        // Função para carregar foto de perfil
        function carregarAvatar(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileURL = e.target.result;
                localStorage.setItem('userAvatar', fileURL);
                aplicarAvatar(fileURL);
            };
            reader.readAsDataURL(file);
        }

        function aplicarAvatar(url) {
            const avatarContainer = document.getElementById('profile-avatar');
            avatarContainer.innerHTML = `<img src="${url}" alt="Avatar">`;
        }

        // Função para editar o nome do perfil
        function editarNome() {
            const atual = document.getElementById('user-name').textContent;
            const novoNome = prompt("Digite o novo nome do perfil:", atual === "DEFINIR NOME" ? "" : atual);
            if (novoNome && novoNome.trim() !== "") {
                const nomeFinal = novoNome.trim();
                document.getElementById('user-name').textContent = nomeFinal;
                localStorage.setItem('userName', nomeFinal);
            }
        }

        // Funções independentes para cada botão 2x2
        function funcaoBotao1() { console.log("Botão 1 acionado"); }
        function funcaoBotao2() { console.log("Botão 2 acionado"); }
        function funcaoBotao3() { console.log("Botão 3 acionado"); }
        function funcaoBotao4() { console.log("Botão 4 acionado"); }
    </script>
</body>
</html>
